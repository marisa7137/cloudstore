syntax = "proto3";

package storage;

option go_package = "cloudstore/gen/storagepb";

import "google/protobuf/timestamp.proto";

// StorageService manages file metadata and file content.
service StorageService {
  // ListFiles returns all file descriptors of one user,
  // including in-progress and failed uploads.
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);

  // InitUpload registers a new file (status: uploading) and creates an
  // upload task tracking chunk progress.
  rpc InitUpload(InitUploadRequest) returns (InitUploadResponse);

  // UploadChunk stores one chunk as a temporary file on disk.
  rpc UploadChunk(UploadChunkRequest) returns (UploadChunkResponse);

  // CompleteUpload verifies all chunks arrived, assembles them into the
  // final blob, computes the md5 and marks file + task complete.
  rpc CompleteUpload(CompleteUploadRequest) returns (FileInfo);

  // ListTasks returns all tasks of a user (uploads), newest first.
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);

  // GetUploadStatus reports which chunks of an in-progress upload are still
  // missing, so an interrupted upload can be resumed.
  rpc GetUploadStatus(UploadStatusRequest) returns (UploadStatusResponse);

  // GetUsage returns the storage currently attributed to a user: completed
  // files at their final size plus in-progress uploads at their declared size.
  rpc GetUsage(UsageRequest) returns (UsageResponse);
}

message UsageRequest {
  int64 user_id = 1;
}

message UsageResponse {
  int64 used_bytes = 1;
}

message ListTasksRequest {
  int64 user_id = 1;
}

message ListTasksResponse {
  repeated TaskInfo tasks = 1;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_IN_PROGRESS = 1;
  TASK_STATUS_COMPLETE = 2;
  TASK_STATUS_FAILED = 3;
}

message TaskInfo {
  int64 id = 1;
  int64 file_id = 2;
  string file_name = 3;  // denormalized from files for display
  int64 file_size = 4;
  string type = 5;
  TaskStatus status = 6;
  int32 chunks_total = 7;
  int32 chunks_received = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  // Exposed so the client can cheaply detect a changed source file
  // (mtime comparison) before hashing gigabytes on resume.
  int64 source_modified_ms = 11;
}

message UploadStatusRequest {
  int64 user_id = 1;
  int64 file_id = 2;
  // Fingerprint of the file the client wants to resume with. If it does not
  // match what was recorded at init, the task is failed and chunks removed.
  string source_hash = 3;
  int64 source_modified_ms = 4;
}

message UploadStatusResponse {
  int32 chunks_total = 1;
  repeated int32 missing_chunks = 2; // 0-based indices not yet on disk
}

message InitUploadRequest {
  int64 user_id = 1;
  string name = 2;
  string mime_type = 3;
  int64 size = 4;        // expected total size in bytes
  int32 chunk_count = 5; // how many chunks the client will send
  // Fingerprint of the source file, used to detect that the file changed
  // between interruption and resume, or during the upload itself.
  string source_hash = 6;        // sha256 hex of the whole file
  int64 source_modified_ms = 7;  // client file mtime, ms since epoch
}

message InitUploadResponse {
  int64 file_id = 1;
  int64 task_id = 2;
}

message UploadChunkRequest {
  int64 user_id = 1;
  int64 file_id = 2;
  int32 chunk_index = 3; // 0-based
  bytes data = 4;
}

message UploadChunkResponse {
  int32 chunks_received = 1;
  int32 chunks_total = 2;
}

message CompleteUploadRequest {
  int64 user_id = 1;
  int64 file_id = 2;
}

message ListFilesRequest {
  int64 user_id = 1;
}

message ListFilesResponse {
  repeated FileInfo files = 1;
  // Sum of sizes of all completed files, in bytes.
  int64 total_size = 2;
}

enum FileStatus {
  FILE_STATUS_UNSPECIFIED = 0;
  FILE_STATUS_UPLOADING = 1;
  FILE_STATUS_COMPLETE = 2;
  FILE_STATUS_FAILED = 3;
}

message FileInfo {
  int64 id = 1;
  int64 user_id = 2;
  string name = 3;
  int64 size = 4;
  string md5 = 5;
  string mime_type = 6;
  FileStatus status = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}
